[DLSSNR_Proxy]
; Personal Cost Scaler Lab build, 2026-09-09. Existing game INIs are preserved by the installer.
; New controls default to legacy behavior unless explicitly enabled.
; 0 = legacy bilinear, 1 = optional prefilter on shrinking axes.
DownsampleFilter = 0
; 1 keeps resolve controls active at 100% NR, with extra texture/resolve overhead.
; 0 keeps the original direct forwarding at native resolution.
ProcessAtNativeResolution = 0
; Master toggle for the proxy
; 1 = Proxy enabled (applies ResolutionScale)
; 0 = Proxy disabled (100% native passthrough to real DLSS-NR)
EnableProxy = 1

; Internal model resolution scale (0.25 to 2.00)
; Values describe dimensions relative to the incoming NR color resource.
; Pixel count is proportional to X * Y before rounding. It is not a measured frame-time ratio.
; 2.00 = 4x pixels; 1.50 = 2.25x pixels; 1.00 = native dimensions.
; Native uses direct forwarding unless ProcessAtNativeResolution = 1.
ResolutionScale = 0.75

; [EXPERIMENTAL] Anamorphic / Asymmetric Neural Scaling (0 = Off, 1 = On, Default: 0)
; Scales horizontal and vertical resolution independently.
; When enabled, uses ResolutionScaleX and ResolutionScaleY instead of uniform ResolutionScale.
; 0.65x Horizontal / 0.85x Vertical uses about 55.25% of incoming pixels.
EnableAnamorphic = 0
ResolutionScaleX = 0.65
ResolutionScaleY = 0.85

; Resolve algorithm
; 1 = Matched Residual (1:1 Native Anchor + Neural Detail Transfer, Ultra Crisp, Recommended)
; 0 = Direct Neural Reconstruction Bilinear + RCAS
EnlargementMode = 1

; Strength of the neural detail transfer (0.0 to 2.0, default 1.0)
TransferStrength = 1.00

; Neural color/tint transfer strength (0.0 to 1.0, default 1.0)
; 1.00 = Full neural color transfer
; 0.00 = Luminance-only transfer (eliminates neural color shifts/tint while keeping full lighting and detail)
ColorStrength = 1.00

; Contrast-adaptive edge sharpening (0.0 to 1.0, default 0.0)
Sharpness = 0.20

; Depth-Aware Bilateral Silhouette Preservation (0 = Off, 1 = On, Default: 1)
; Uses the native depth buffer to preserve crisp object silhouettes and geometric boundaries,
; preventing low-resolution neural radiance from bleeding across foreground edges.
EnableDepthAwareResolve = 1

; [EXPERIMENTAL] Alternating frame neural execution / VRNR (0 = Off, 1 = On, Default: 0)
; Evaluates DLSS-NR every 2nd frame for higher synthetic average FPS.
; WARNING: Causes 30Hz sawtooth frame pacing (choppy motion in camera pans) and visual flicker
; in games with native ray tracing / motion vectors. Keep 0 (OFF) for smooth gameplay.
EnableAlternatingFrames = 0

; Enable in-game hotkeys
EnableHotkeys = 1

[DLSSNR_Settings]
; Official NVIDIA DLSS-NR internal model tuning parameters.
; When UseCustomSettings = 0 (default), the proxy passes through whatever NR params
; the caller (OptiScaler, RenoDX, game engine) sets — our values below are ignored.
; Set to 1 to override the caller's NR settings with the values configured here.
UseCustomSettings = 0

; Style of neural reconstruction:
; 0 = Balanced (Default DLSS-NR tuning)
; 1 = Sharp (Crisp edges and heightened micro-contrast)
; 2 = Cinematic (Softer film roll-off with natural grain retention)
Style = 0

; Overall neural denoising and reconstruction intensity (0.00 to 2.00, default 1.00)
Intensity = 1.00

; Strength of high-frequency local geometry and structure preservation (0.00 to 2.00, default 1.00)
LocalStructureStrength = 1.00

; Strength of local HDR luminance contrast and tonal micro-transitions (0.00 to 2.00, default 1.00)
LocalToneStrength = 1.00

; Skin texture and human character structure preservation (-1.00 to 2.00, default -1.00)
; -1.00 = Auto (model dynamically infers human skin based on semantic heuristics)
SkinStructureStrength = -1.00

; Enable automatic internal heuristic masking for fast-moving or thin elements (0 = Off, 1 = On)
UseAutoMask = 0

[Hotkeys]
; Require Ctrl + Alt modifiers held down with the hotkey (1 = yes, 0 = no)
RequireCtrlAlt = 1

; Virtual-Key codes (Decimal):
; Space=32, PageUp=33, PageDown=34, End=35, Home=36, Insert=45, Delete=46
KeyToggleProxy = 32
KeyToggleMode = 35
KeyScaleUp = 33
KeyScaleDown = 34


